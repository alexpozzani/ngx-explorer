<div class="nxe-breadcrumbs">
    @for (crumb of breadcrumbs$ | async; track $index; let last = $last) {
        <span>
            <button mat-button color="primary" (click)="click(crumb)">{{ crumb.name }}</button>
            @if (!last) {
                <span class="nxe-breadcrumb-separator">
                    <mat-icon>chevron_right</mat-icon>
                </span>
            }
        </span>
    }
</div>
