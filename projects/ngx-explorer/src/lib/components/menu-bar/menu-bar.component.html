<div class="nxe-menu-bar">
    <div class="nxe-menu-bar-left">

        @if (isSmallScreen) {
            <button mat-icon-button class="nxe-tree-toggle" (click)="toggleTree()">
                <mat-icon>menu</mat-icon>
            </button>
        }

        @if (featCreateDir) {
            <button mat-stroked-button color="primary" (click)="createDir()">
                <mat-icon>create_new_folder</mat-icon> New Folder
            </button>
        }

        <button mat-stroked-button color="accent" (click)="refresh()">
            <mat-icon>refresh</mat-icon> Refresh
        </button>

        @if (featUpload) {
            <button mat-raised-button color="primary" (click)="openUploader()">
                <mat-icon>upload</mat-icon> Upload
            </button>
        }

        @if (featDownload) {
            <button mat-raised-button color="primary" [disabled]="!(canDownload$ | async)" (click)="download()">
                <mat-icon>download</mat-icon> Download
            </button>
        }

        @if (featRename) {
            <button mat-raised-button color="primary" [disabled]="!(canRename$ | async)" (click)="rename()">
                <mat-icon>edit</mat-icon> Rename
            </button>
        }

        @if (featDelete) {
            <button mat-raised-button color="warn" [disabled]="!(canDelete$ | async)" (click)="remove()">
                <mat-icon>delete</mat-icon> Delete
            </button>
        }
    </div>
    <div class="nxe-menu-bar-right">
        <nxe-view-switcher></nxe-view-switcher>
    </div>
    <input style="display: none" type="file" multiple (change)="handleFiles($event)" #uploader />
</div>
