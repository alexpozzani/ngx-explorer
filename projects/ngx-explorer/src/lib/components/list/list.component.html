<div class="nxe-list" nxeDragDrop (dragging)="dragging = $event">
    <div class="nxe-list-drag" [ngClass]="{ dragging: dragging }"></div>
    <div class="nxe-list-backpad" (click)="emptySpaceClick()"></div>
    <div class="nxe-list-container">
        <div class="nxe-list-wrapper">
            <table mat-table [dataSource]="items">
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let item">
                        <div class="nxe-list-item-content">
                            <mat-icon class="nxe-list-icon">{{ getFileIcon(item) }}</mat-icon>
                            {{ item.name }}
                        </div>
                    </td>
                </ng-container>
                <!-- Add other columns as needed -->
                <tr mat-header-row *matHeaderRowDef="['name']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['name'];"
                    (dblclick)="open($event, row)"
                    (click)="select($event, row)"
                    [ngClass]="{ 'nxe-list-row-selected': isSelected(row) }"
                ></tr>
            </table>
        </div>
    </div>
</div>
